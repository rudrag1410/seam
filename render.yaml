projects:
  - name: seam
    environments:
      - name: production
        services:
          - type: web
            name: seam-api
            runtime: docker
            plan: free
            region: oregon
            rootDir: apps/backend
            dockerfilePath: ./Dockerfile
            healthCheckPath: /readyz
            envVars:
              - { key: APP_ENV, value: production }
              - { key: DATABASE_URL, fromDatabase: { name: seam-db, property: connectionString } }
              - { key: JWT_SECRET, generateValue: true }
              - { key: FIELD_ENCRYPTION_KEY, generateValue: true }
              - { key: COOKIE_SECURE, value: "true" }
              - { key: COOKIE_SAMESITE, value: lax }
              - { key: APP_URL, sync: false }
              - { key: CORS_ORIGINS, sync: false }
              - { key: OPENAI_API_KEY, sync: false }
              - { key: TYPESAFE_API_KEY, sync: false }
              - { key: R2_ENDPOINT, sync: false }
              - { key: R2_ACCESS_KEY_ID, sync: false }
              - { key: R2_SECRET_ACCESS_KEY, sync: false }
              - { key: R2_BUCKET, sync: false }
          - type: web
            name: seam-web
            runtime: node
            plan: free
            region: oregon
            buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @seam/frontend build
            startCommand: corepack enable && pnpm --filter @seam/frontend start
            envVars:
              - { key: NODE_VERSION, value: "22" }
              - { key: NEXT_PUBLIC_API_URL, value: "" }
              - { key: API_PROXY_URL, sync: false }
        databases:
          - name: seam-db
            plan: free
            region: oregon
            databaseName: seam
