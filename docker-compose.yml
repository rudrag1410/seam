services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: seam
      POSTGRES_PASSWORD: seam
      POSTGRES_DB: seam
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seam"]
      interval: 5s
      retries: 10
volumes:
  pgdata:
